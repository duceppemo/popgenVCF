{% set version = "1.0.15" %}
{% set sha256 = "f423751c2f94858fd1ea77ab23f09722004091461c048501c4824a7aeb08a924" %}

# v1.0.13 is the first release built from the shrunk source tarball
# (commit 5110c76 downsampled vignettes/figures/*.png; 64.7 MB -> 22.0 MB).
# sha256 taken from v1.0.13's own release-SHA256SUMS.txt asset and
# independently re-verified by downloading popgenVCF_1.0.13.tar.gz itself
# and hashing it directly -- both matched exactly
# (1b15263af74ee40794367952a4306c92ae4638635140e1292555bac512b4c0e9).

# Named r-popgenvcf, not popgenvcf: bioconda convention prefixes every R
# package with `r-` (lowercase, like the package name itself), regardless
# of whether it originates on CRAN, Bioconductor, or -- as here -- only on
# GitHub. Bioconductor-hosted dependencies get `bioconductor-` instead
# (see bioconductor-gdsfmt/bioconductor-snprelate below). The real install
# command once/if this is accepted is `mamba install r-popgenvcf`, not
# `mamba install popgenVCF`; popgenVCF's own name/DESCRIPTION/GitHub
# identity are unaffected -- only this conda channel entry is prefixed.
package:
  name: r-popgenvcf
  version: {{ version }}

source:
  url: https://github.com/duceppemo/popgenVCF/releases/download/v{{ version }}/popgenVCF_{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  # Real semantic versioning, not 0.x.x: popgenVCF's own public-API-contract
  # check (inst/api-contract/) pins and re-verifies its exported R API on
  # every single release, patch included, with zero drift across every
  # release this project has ever cut -- API/ABI/CLI breakage is reserved
  # for major-version bumps, matching the "semantic versioning" row of
  # bioconda's own run_exports guidance table, not the "0.x.x" row.
  run_exports:
    - {{ pin_subpackage("r-popgenvcf", max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - {{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - r-base >=4.3
    - r-ade4
    - r-adegenet
    - r-ape
    - r-data.table
    - r-digest
    - bioconductor-gdsfmt
    - r-ggplot2 >=3.5.0
    - r-ggrepel
    - r-igraph
    - r-jsonlite
    - r-openssl
    - r-poppr
    - r-processx
    - r-rmarkdown
    - r-scales
    - bioconductor-snprelate
    - r-vegan
    - r-yaml
  run:
    - r-base >=4.3
    - r-ade4
    - r-adegenet
    - r-ape
    - r-data.table
    - r-digest
    - bioconductor-gdsfmt
    - r-ggplot2 >=3.5.0
    - r-ggrepel
    - r-igraph
    - r-jsonlite
    - r-openssl
    - r-poppr
    - r-processx
    - r-rmarkdown
    - r-scales
    - bioconductor-snprelate
    - r-vegan
    - r-yaml
    # Required at runtime, not just build time: VCF sorting, BGZF
    # compression, indexing, and runs-of-homozygosity detection all shell
    # out to these (DESCRIPTION's SystemRequirements). Deliberately NOT
    # included: admixture and faststructure, both genuinely optional
    # (only used by the ancestry backends when explicitly configured) and
    # each a heavyweight compiled tool in its own right -- a user who
    # wants them installs them separately the same way the container image
    # documents, keeping this recipe's own dependency footprint minimal.
    - bcftools
    - htslib
    # Used by every report-rendering code path (R/report.R); without it,
    # the core "produce a manuscript report" feature silently degrades to
    # HTML-only or fails outright rather than being a true optional extra.
    - pandoc

test:
  commands:
    # Import test: the standard bioconda smoke test for an R package.
    - $R -e "library('popgenVCF')"
    # CLI smoke test: confirms the installed wrapper script actually runs
    # popgenVCF::cli_main() end to end, not just that the library loads.
    - popgenVCF --help

about:
  home: https://github.com/duceppemo/popgenVCF
  license: MIT
  license_file: LICENSE
  summary: Population genomics toolkit for VCF data
  description: |
    A modular R package and command-line toolkit for reproducible
    population-genomic analysis of diploid, biallelic SNP data stored in
    VCF files: quality control, PCA, IBS/MDS, diversity, FST, kinship,
    genetic sex check, runs of homozygosity, sliding-window genome scans,
    DAPC, AMOVA, population structure, spatial genetics, and
    manuscript-oriented publication reports.
  dev_url: https://github.com/duceppemo/popgenVCF
  doc_url: https://duceppemo.github.io/popgenVCF/

extra:
  recipe-maintainers:
    - duceppemo
  identifiers:
    - doi:10.5281/zenodo.21747067
