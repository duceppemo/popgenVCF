name: Release candidate evidence collector

# Dispatches every CI-producible release-candidate gate's workflow for a
# candidate commit in parallel (one matrix job per gate workflow, on
# separate runners), waits for each to finish, downloads their
# "<gate_id>-gate-record.json" fragments, and assembles a
# release-candidate-evidence-index.json covering the 8 gates real CI can
# determine on its own (metadata_consistency, public_api_contract,
# source_package_check, scientific_validation, canonical_validation,
# source_distribution, apptainer_distribution, and -- only when
# publish_container is set -- oci_distribution).
#
# The remaining 7 gates (production_baseline, external_concordance,
# ancestry_three_backend, benchmark_history, scientific_approval,
# release_authorization, archival_assets) require real scientific review, a
# named approval, or a real Zenodo deposition and are deliberately left
# not_run here -- this workflow never fabricates that evidence. Add their
# own "<gate_id>-gate-record.json" fragments to the downloaded
# collected-sources/ artifact and re-run
# scripts/build_release_candidate_evidence_index.R locally to produce the
# complete, final index once that review has actually happened. See
# docs/developer/release-candidate-closure.md.
#
# candidate_ref must be a branch or tag (the workflow_dispatch API cannot
# target an arbitrary commit SHA); each matrix job verifies its dispatched
# sub-workflow run actually landed on the exact commit resolved in the
# "plan" job, failing rather than silently accepting a stale prior run if
# the ref moved in between.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch or tag to build evidence for
        required: false
        default: main
        type: string
      candidate_id:
        description: Stable identifier for this evidence-collection run
        required: true
        type: string
      dataset:
        description: Approved canonical dataset to validate
        required: false
        default: chr22
        type: choice
        options:
          - chr22
          - chrY
      publish_container:
        description: Actually push the OCI image to GHCR (real registry push; leave off for a dry run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: release-candidate-collector-${{ inputs.candidate_ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      since: ${{ steps.candidate.outputs.since }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Resolve candidate commit
        id: candidate
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build gate-workflow dispatch matrix
        id: matrix
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate_id "${{ inputs.candidate_id }}" \
            --arg dataset "${{ inputs.dataset }}" \
            --argjson publish_container ${{ inputs.publish_container }} \
            '[
              {workflow: "release-metadata.yml", key: "release-metadata", args: []},
              {workflow: "public-api-contract.yml", key: "public-api-contract", args: []},
              {workflow: "tagged-source-release.yml", key: "tagged-source-release", args: ["-f", "publish=false"]},
              {workflow: "canonical-real-data.yml", key: "canonical-real-data", args: [
                "-f", ("candidate_id=" + $candidate_id + "-canonical-validation"),
                "-f", "confirm_production=true",
                "-f", ("dataset=" + $dataset)
              ]},
              {workflow: "apptainer.yml", key: "apptainer", args: []}
            ] + (if $publish_container then [
              {workflow: "container.yml", key: "container", args: ["-f", "publish=true"]}
            ] else [] end)' > matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
          cat matrix.json

  dispatch:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch, wait for, and download ${{ matrix.workflow }}
        run: |
          set -euo pipefail
          sha="${{ needs.plan.outputs.sha }}"
          ref="${{ inputs.candidate_ref }}"
          since="${{ needs.plan.outputs.since }}"
          workflow="${{ matrix.workflow }}"

          gh workflow run "$workflow" --ref "$ref" ${{ join(matrix.args, ' ') }}

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow="$workflow" --json databaseId,headSha,createdAt \
              --jq "[.[] | select(.headSha == \"$sha\" and .createdAt >= \"$since\")] | sort_by(.databaseId) | last | .databaseId // empty")"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "No dispatched run of ${workflow} appeared at ${sha}" >&2
            exit 1
          fi
          echo "Watching run ${run_id} for ${workflow}"
          gh run watch "$run_id" || true

          mkdir -p collected-sources
          # Some workflows (e.g. container.yml, via docker/build-push-action's
          # cache-to: type=gha) also produce a "*.dockerbuild" cache artifact
          # that gh run download cannot extract as a normal zip. Downloading
          # every artifact in one call aborts entirely on that one broken
          # artifact, silently losing the real ones too -- so download each
          # real artifact by name individually instead.
          mapfile -t artifact_names < <(
            gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[].name' | grep -v '\.dockerbuild$' || true
          )
          if [[ "${#artifact_names[@]}" -eq 0 ]]; then
            echo "No downloadable (non-cache) artifacts for ${workflow} run ${run_id} (it may have failed before producing any)" >&2
          fi
          for name in "${artifact_names[@]}"; do
            gh run download "$run_id" -n "$name" -D collected-sources || \
              echo "Failed to download artifact '${name}' from ${workflow} run ${run_id}" >&2
          done

      - name: Upload collected fragment(s)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-collector-fragment-${{ matrix.key }}
          path: collected-sources/
          if-no-files-found: warn
          retention-days: 14

  assemble:
    needs: [plan, dispatch]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref }}

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install collector dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "digest", "data.table"))'

      - name: Download all collected fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: collected-sources
          pattern: release-candidate-collector-fragment-*

      - name: Assemble evidence index
        run: |
          Rscript scripts/build_release_candidate_evidence_index.R \
            inst/metadata/release-candidate-policy.json \
            collected-sources \
            collected-evidence-index.json \
            collected-evidence \
            "${{ inputs.candidate_id }}" \
            "${{ needs.plan.outputs.sha }}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Write collection summary
        if: always()
        run: |
          {
            echo "## Release candidate evidence collection"
            echo
            echo "- Candidate ref: \`${{ inputs.candidate_ref }}\`"
            echo "- Candidate commit: \`${{ needs.plan.outputs.sha }}\`"
            if [[ -f collected-evidence-index.json ]]; then
              echo
              echo "Gates with a real fragment (the rest are honestly \`not_run\` -- see the job summary above for why):"
              echo
              jq -r '.records[] | select(.status != "not_run") | "- \(.gate_id): \(.status)"' collected-evidence-index.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload collected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-collected-evidence-${{ inputs.candidate_id }}
          path: |
            collected-evidence-index.json
            collected-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if any gate workflow could not be dispatched or located
        if: needs.dispatch.result != 'success'
        run: |
          echo "One or more gate workflows failed to dispatch, never produced a run at the candidate commit, or errored; see the dispatch job(s) above." >&2
          exit 1
