name: Tagged source-package release

on:
  pull_request:
    paths:
      - '.github/workflows/tagged-source-release.yml'
      - '.zenodo.json'
      - 'CITATION.cff'
      - 'codemeta.json'
      - 'docs/reproducibility.md'
      - 'docs/developer/release-archival-readiness.md'
      - 'scripts/build_release_manifest.R'
      - 'inst/scripts/build_release_manifest.R'
      - 'scripts/build_release_provenance.R'
      - 'inst/scripts/build_release_provenance.R'
      - 'scripts/build_scientific_release_integration.R'
      - 'tests/testthat/test-release-manifest.R'
      - 'tests/testthat/test-release-provenance.R'
      - 'docs/developer/tagged-source-release.md'
      - 'DESCRIPTION'
      - '.Rbuildignore'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_id:
        description: Release identifier; must equal v<DESCRIPTION version>
        required: false
        type: string
      publish:
        description: Publish assets to the matching GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tagged-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      POPGENVCF_RELEASE_CREATED_AT: '1970-01-01T00:00:00Z'

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::knitr
          needs: check

      - name: Resolve and verify release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk -F': *' '$1 == "Version" {print $2}' DESCRIPTION)"
          expected_release="v${package_version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_id="${GITHUB_REF_NAME}"
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_id="${{ inputs.release_id }}"
            publish="${{ inputs.publish }}"
            [[ -n "${release_id}" ]] || release_id="${expected_release}"
          else
            release_id="${expected_release}"
            publish=false
          fi

          if [[ "${release_id}" != "${expected_release}" ]]; then
            echo "::error::Release identity mismatch: expected ${expected_release}, received ${release_id}"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${expected_release}" ]]; then
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match DESCRIPTION version ${package_version}"
            exit 1
          fi

          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build source package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_root="${PWD}"
          mkdir -p release-work/source release-assets
          cd release-work/source
          R CMD build --no-manual --compact-vignettes=gs+qpdf "${package_root}"
          tarball="$(find "${PWD}" -maxdepth 1 -name 'popgenVCF_*.tar.gz' -print -quit)"
          [[ -n "${tarball}" ]]
          cp "${tarball}" "${package_root}/release-assets/"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "${tarball}")" >> "$GITHUB_OUTPUT"

      - name: Collect archival metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-work/archive-metadata
          cp .zenodo.json release-work/archive-metadata/.zenodo.json
          cp CITATION.cff release-work/archive-metadata/CITATION.cff
          cp codemeta.json release-work/archive-metadata/codemeta.json
          cp docs/reproducibility.md release-work/archive-metadata/reproducibility.md
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf release-assets/popgenVCF-archive-metadata.tar.gz \
            -C release-work/archive-metadata .

      - name: Generate source-package SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: release-assets/${{ steps.package.outputs.asset }}
          format: spdx-json
          output-file: release-assets/popgenVCF-source-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate source-package SBOM
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/popgenVCF-source-sbom.spdx.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("release-assets/popgenVCF-source-sbom.spdx.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          assert str(document.get("spdxVersion", "")).startswith("SPDX-")
          assert document.get("SPDXID") == "SPDXRef-DOCUMENT"
          assert isinstance(document.get("packages", []), list)
          PY

      - name: Check built source package
        id: check
        shell: bash
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
        run: |
          set -euo pipefail
          mkdir -p release-work/check
          R CMD check \
            --no-manual \
            --as-cran \
            --output=release-work/check \
            "${{ steps.package.outputs.tarball }}"
          check_dir="$(find release-work/check -maxdepth 1 -type d -name '*.Rcheck' -print -quit)"
          [[ -n "${check_dir}" ]]
          tar -czf release-assets/popgenVCF-check-results.tar.gz \
            -C release-work/check "$(basename "${check_dir}")"
          cp "${check_dir}/00check.log" release-assets/R-CMD-check.log
          cp "${check_dir}/00install.out" release-assets/R-CMD-install.out
          echo "check_dir=${check_dir}" >> "$GITHUB_OUTPUT"

      - name: Write source_package_check gate record
        run: |
          Rscript -e '
            source("inst/scripts/release_candidate_gate_record.R")
            log_lines <- readLines("release-assets/R-CMD-check.log", warn = FALSE)
            status_line <- grep("^Status:", log_lines, value = TRUE)
            ok <- length(status_line) == 1L &&
              !grepl("ERROR", status_line, fixed = TRUE) &&
              !grepl("WARNING", status_line, fixed = TRUE)
            write_release_candidate_gate_record(
              gate_id = "source_package_check",
              status = if (ok) "passed" else "failed",
              summary = paste0(
                "R CMD check --as-cran on the exact built source tarball: ",
                if (length(status_line)) status_line else "no Status line found",
                ". 00install.out records the clean-library install R CMD check performed",
                " internally as part of the same run."
              ),
              artifact_paths = c("release-assets/R-CMD-check.log", "release-assets/R-CMD-install.out"),
              root = ".",
              output_path = "release-assets/source_package_check-gate-record.json"
            )
          '

      - name: Install checked package
        run: R CMD INSTALL "${{ steps.package.outputs.tarball }}"

      - name: Build scientific release evidence
        env:
          POPGENVCF_RELEASE_DATE: '2026-07-18'
        run: |
          Rscript scripts/build_scientific_release_integration.R \
            release-work/scientific-release \
            "${{ steps.identity.outputs.release_id }}"
          tar -czf release-assets/popgenVCF-scientific-release.tar.gz \
            -C release-work/scientific-release .
          cp release-work/scientific-release/integration-summary.json \
            release-assets/scientific-release-integration-summary.json
          cp release-work/scientific-release/determinism-comparison.tsv \
            release-assets/scientific-release-determinism.tsv
          cp release-work/scientific-release/run-a/records/scientific-validation.tsv \
            release-assets/scientific-validation.tsv
          cp release-work/scientific-release/run-a/records/population-structure-validation.tsv \
            release-assets/population-structure-validation.tsv

      - name: Write scientific_validation gate record
        run: |
          Rscript -e '
            source("inst/scripts/release_candidate_gate_record.R")
            core <- read.delim("release-assets/scientific-validation.tsv", stringsAsFactors = FALSE)
            structure <- read.delim("release-assets/population-structure-validation.tsv", stringsAsFactors = FALSE)
            ok <- all(as.logical(core$passed)) && all(as.logical(structure$passed))
            write_release_candidate_gate_record(
              gate_id = "scientific_validation",
              status = if (ok) "passed" else "failed",
              summary = sprintf(
                "run_scientific_validation() (%d checks) and run_population_structure_validation() (%d checks): %s.",
                nrow(core), nrow(structure), if (ok) "all passed with no failing checks" else "at least one check failed"
              ),
              artifact_paths = c(
                "release-assets/scientific-validation.tsv",
                "release-assets/population-structure-validation.tsv"
              ),
              root = ".",
              output_path = "release-assets/scientific_validation-gate-record.json"
            )
          '

      - name: Record runtime and dependencies
        shell: Rscript {0}
        run: |
          writeLines(capture.output(sessionInfo()), "release-assets/session-info.txt")
          installed <- as.data.frame(utils::installed.packages()[, c("Package", "Version", "LibPath")])
          installed <- installed[order(installed$Package, installed$Version, installed$LibPath), ]
          data.table::fwrite(
            installed,
            "release-assets/r-package-manifest.tsv",
            sep = "\t",
            quote = FALSE
          )

      - name: Generate source-release provenance
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/build_release_provenance.R \
            release-assets \
            popgenVCF \
            "${{ steps.identity.outputs.package_version }}" \
            "${{ steps.identity.outputs.release_id }}" \
            "${{ steps.identity.outputs.release_id }}" \
            "${GITHUB_SHA}" \
            "${GITHUB_WORKFLOW}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${{ steps.package.outputs.asset }}" \
            popgenVCF-source-sbom.spdx.json \
            popgenVCF-archive-metadata.tar.gz

      - name: Generate and verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          r_version="$(Rscript -e 'cat(as.character(getRversion()))')"
          Rscript scripts/build_release_manifest.R \
            release-assets \
            popgenVCF \
            "${{ steps.identity.outputs.package_version }}" \
            "${{ steps.identity.outputs.release_id }}" \
            "${{ steps.identity.outputs.release_id }}" \
            "${GITHUB_SHA}" \
            "${r_version}" \
            "${GITHUB_WORKFLOW}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}"

      - name: Write source_distribution gate record
        run: |
          Rscript -e '
            source("inst/scripts/release_candidate_gate_record.R")
            write_release_candidate_gate_record(
              gate_id = "source_distribution",
              status = "passed",
              summary = paste(
                "tagged-source-release.yml built the exact source tarball, generated its SPDX",
                "SBOM, wrote source-release-provenance.json binding the release/commit/workflow",
                "identity to the tarball and SBOM, and produced release-manifest.json and the",
                "terminal release-SHA256SUMS.txt for the exact evaluated commit, all in a clean",
                "GitHub-hosted runner. Reaching this step means every prior build, check, and",
                "manifest-verification step already succeeded."
              ),
              artifact_paths = c(
                "release-assets/${{ steps.package.outputs.asset }}",
                "release-assets/popgenVCF-source-sbom.spdx.json",
                "release-assets/source-release-provenance.json",
                "release-assets/release-manifest.json",
                "release-assets/release-SHA256SUMS.txt"
              ),
              root = ".",
              output_path = "release-assets/source_distribution-gate-record.json"
            )
          '

      - name: Upload rehearsal or release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popgenVCF-${{ steps.identity.outputs.release_id }}-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.identity.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.identity.outputs.release_id }}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --generate-notes
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          [[ "${#assets[@]}" -gt 0 ]]
          gh release upload "${tag}" "${assets[@]}" --clobber
