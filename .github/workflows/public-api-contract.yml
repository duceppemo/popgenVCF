name: Public API contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install package
        run: R CMD INSTALL .

      - name: Restore canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f inst/api-contract/public-api-baseline.tsv.gz.b64
          test -f inst/api-contract/public-api-baseline.dcf
          base64 --decode inst/api-contract/public-api-baseline.tsv.gz.b64 | gzip --decompress > inst/api-contract/public-api-baseline.tsv
          expected_digest="$(sed -n 's/^Snapshot-SHA256: //p' inst/api-contract/public-api-baseline.dcf)"
          actual_digest="$(sha256sum inst/api-contract/public-api-baseline.tsv | cut -d' ' -f1)"
          test -n "$expected_digest"
          if [[ "$expected_digest" != "$actual_digest" ]]; then
            echo "Canonical baseline SHA-256 mismatch: expected $expected_digest, got $actual_digest" >&2
            exit 1
          fi

      - name: Generate current contract
        run: |
          mkdir -p artifacts/public-api-contract
          Rscript tools/update-public-api-baseline.R . artifacts/public-api-contract/public-api-current.tsv artifacts/public-api-contract/public-api-current.dcf

      - name: Verify canonical baseline
        run: |
          Rscript tools/check-public-api-contract.R . artifacts/public-api-contract inst/api-contract/public-api-baseline.tsv
          Rscript - <<'RSCRIPT'
          metadata <- read.dcf("inst/api-contract/public-api-baseline.dcf")
          expected_version <- unname(metadata[1L, "Version"])
          installed_version <- as.character(utils::packageVersion("popgenVCF"))
          # A `.9NNN`-suffixed installed version (standard R convention for a
          # development build following a release) is reconciled against its
          # released X.Y.Z prefix -- the baseline stays pinned to the last
          # release the public API was actually audited against, and is
          # re-pinned to a new exact version only when the API itself changes.
          released_prefix <- sub("^([0-9]+\\.[0-9]+\\.[0-9]+)\\.9[0-9]{3}$", "\\1", installed_version)
          if (is.na(expected_version) || expected_version != released_prefix) {
            stop("Baseline version ", expected_version, " does not match installed package version ", installed_version)
          }
          expected_entries <- suppressWarnings(as.integer(unname(metadata[1L, "Entries"])))
          baseline <- utils::read.delim(
            "inst/api-contract/public-api-baseline.tsv",
            stringsAsFactors = FALSE,
            check.names = FALSE,
            na.strings = "",
            quote = ""
          )
          actual_entries <- nrow(baseline)
          if (is.na(expected_entries) || expected_entries != actual_entries) {
            stop("Baseline entry count mismatch: metadata declares ", expected_entries, ", file contains ", actual_entries)
          }
          RSCRIPT

      # if: always() is required here, not cosmetic: every step above stops
      # the job outright on a genuine contract violation (a real audit found
      # this step had no `if:` guard at all, so a real failure skipped it
      # entirely -- no gate-record JSON was ever written for the exact case
      # this gate exists to catch, and its own "failed" branch was dead
      # code). Written defensively so a step that failed before producing
      # public-api-summary.tsv at all (not just "produced it with
      # passed = FALSE") still yields an accurate "failed" record instead of
      # erroring inside this step too.
      - name: Write public_api_contract gate record
        if: always()
        run: |
          Rscript -e '
            source("inst/scripts/release_candidate_gate_record.R")
            root <- "artifacts/public-api-contract"
            dir.create(root, recursive = TRUE, showWarnings = FALSE)
            summary_path <- file.path(root, "public-api-summary.tsv")
            findings_path <- file.path(root, "public-api-findings.tsv")
            if (file.exists(summary_path)) {
              summary_table <- read.delim(summary_path, stringsAsFactors = FALSE)
              passed <- isTRUE(as.logical(summary_table$passed[[1L]]))
              summary_text <- sprintf(
                "public-api-contract.yml canonical baseline verification: %d entries, %d blocking finding(s), %d advisory finding(s).",
                summary_table$entries[[1L]], summary_table$blocking_findings[[1L]], summary_table$advisory_findings[[1L]]
              )
            } else {
              passed <- FALSE
              summary_text <- "public-api-contract.yml failed before the contract summary could be generated -- see the job log for the failing step."
            }
            write_release_candidate_gate_record(
              gate_id = "public_api_contract",
              status = if (passed) "passed" else "failed",
              summary = summary_text,
              artifact_paths = Filter(file.exists, c(summary_path, findings_path)),
              root = root,
              output_path = file.path(root, "public_api_contract-gate-record.json")
            )
          '

      - name: Upload API contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-api-contract
          path: artifacts/public-api-contract
          if-no-files-found: warn
