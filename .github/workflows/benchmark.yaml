name: quick-benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yaml'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: any::remotes
      - name: Install package
        id: install
        shell: bash
        run: |
          set +e
          R CMD INSTALL . > install.log 2>&1
          status=$?
          cat install.log
          exit "$status"
      - name: Upload installation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-install-log
          path: install.log
      - name: Run quick benchmark
        env:
          POPGENVCF_BENCHMARK_QUICK: 'true'
        run: Rscript benchmarks/run-benchmarks.R benchmarks/results/quick.tsv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-benchmark
          path: benchmarks/results/quick.tsv
