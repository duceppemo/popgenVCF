name: Scientific release archive

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_id:
        description: Archive release identifier
        required: false
        type: string
      benchmark_tiers:
        description: >-
          Comma-separated continuous-benchmark dataset tiers to run
          (synthetic, canonical, medium, large). canonical downloads the
          real, already-approved chr22 1000 Genomes source and requires
          bcftools; leave at the default for a fast, network-free run.
        required: false
        default: synthetic
        type: string

permissions:
  contents: write

concurrency:
  group: scientific-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::knitr
          needs: check

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Install bcftools and tabix
        if: contains(inputs.benchmark_tiers, 'canonical')
        run: |
          sudo apt-get update --yes
          sudo apt-get install --yes --no-install-recommends bcftools tabix
          bcftools --version

      - name: Install popgenVCF
        run: R CMD INSTALL .

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            value="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::12}"
          elif [[ -n "${{ inputs.release_id }}" ]]; then
            value="${{ inputs.release_id }}"
          else
            value="${GITHUB_REF_NAME}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Download latest prior published archive
        id: baseline
        shell: bash
        run: |
          mkdir -p baseline-download baseline
          selected=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            [[ "$tag" == "${GITHUB_REF_NAME}" ]] && continue
            rm -f baseline-download/scientific-benchmark-archive.tar.gz
            if gh release download "$tag" \
                --pattern 'scientific-benchmark-archive.tar.gz' \
                --dir baseline-download; then
              selected="$tag"
              break
            fi
          done < <(gh release list --limit 20 --json tagName --jq '.[].tagName')
          if [[ -n "$selected" ]]; then
            tar -xzf baseline-download/scientific-benchmark-archive.tar.gz -C baseline
            echo "path=baseline/archive" >> "$GITHUB_OUTPUT"
            echo "release=$selected" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive and regression report
        env:
          POPGENVCF_RELEASE_ID: ${{ steps.identity.outputs.value }}
          POPGENVCF_BENCHMARK_TIERS: ${{ inputs.benchmark_tiers }}
        run: |
          Rscript scripts/build_release_benchmark_archive.R \
            benchmark-release "${{ steps.baseline.outputs.path }}"

      - name: Package archive
        # Runs even when the preceding R script failed its regression/budget
        # gate checks: those stop() calls fire *after* the report and
        # continuous-benchmark evidence files are already written to disk
        # (see build_release_benchmark_archive.R), so the diagnostic files a
        # failure needs to actually be root-caused already exist -- they were
        # just never packaged or uploaded before, meaning every real check
        # failure discarded its own evidence and had to be reproduced by hand
        # from scratch. `|| true` on each tar call tolerates the rarer case
        # where the R script crashed early enough that some of these files
        # genuinely don't exist yet, so this step's own failure never masks
        # the real one already recorded by the previous step.
        if: always()
        shell: bash
        run: |
          tar -czf scientific-benchmark-archive.tar.gz \
            -C benchmark-release archive || true
          tar -czf scientific-regression-report.tar.gz \
            -C benchmark-release report release_benchmark_summary.tsv || true
          sha256sum scientific-benchmark-archive.tar.gz \
            scientific-regression-report.tar.gz > scientific-release-SHA256SUMS.txt || true

      - name: Upload workflow artifacts
        # Also runs on failure, for the same reason as "Package archive"
        # above -- if-no-files-found is "warn", not "error", so a genuinely
        # early crash with nothing to upload doesn't add a second, unrelated
        # failure on top of the real one.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-release-${{ steps.identity.outputs.value }}
          path: |
            scientific-benchmark-archive.tar.gz
            scientific-regression-report.tar.gz
            scientific-release-SHA256SUMS.txt
            benchmark-release/release_benchmark_summary.tsv
            benchmark-release/report/regression_report.html
            benchmark-release/report/regression_report.qmd
            benchmark-release/report/release_comparison.tsv
            benchmark-release/archive/continuous_benchmarks.tsv
            benchmark-release/archive/continuous_benchmark_summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            scientific-benchmark-archive.tar.gz \
            scientific-regression-report.tar.gz \
            scientific-release-SHA256SUMS.txt \
            --clobber
