name: Apptainer

on:
  pull_request:
    paths:
      - "Apptainer.def"
      - "Dockerfile"
      - "docker/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "inst/conda/**"
      - "inst/scripts/install-bioconductor.R"
      - ".github/workflows/apptainer.yml"
  workflow_dispatch:
    inputs:
      debug:
        description: Open an interactive tmate SSH session before the build step (for diagnosing a real build failure -- see NEWS.md/ROADMAP.md)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apptainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer version

      - name: Debug session (tmate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug == true }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
        timeout-minutes: 80

      - name: Build SIF image
        env:
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
          APPTAINER_TMPDIR: ${{ runner.temp }}/apptainer-tmp
        run: |
          mkdir -p "$APPTAINER_CACHEDIR" "$APPTAINER_TMPDIR"
          sudo -E apptainer build popgenvcf.sif Apptainer.def

      - name: Test SIF image
        run: |
          apptainer test popgenvcf.sif
          apptainer exec popgenvcf.sif Rscript -e 'cat(as.character(packageVersion("popgenVCF")), "\n")'
          apptainer run popgenvcf.sif --help
          apptainer exec popgenvcf.sif Rscript -e '
            core <- popgenVCF::run_scientific_validation(integration = TRUE, threads = 4)
            structure <- popgenVCF::run_population_structure_validation(integration = TRUE)
            stopifnot(core$passed, structure$passed)
          '

      - name: Write build metadata
        run: |
          set -euo pipefail
          mkdir -p apptainer-metadata
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
          jq -n \
            --arg schema_version "1.0" \
            --arg record_type "popgenvcf_apptainer_build" \
            --arg package_version "$package_version" \
            --arg git_commit "$(git rev-parse HEAD)" \
            --arg apptainer_version "$(apptainer version)" \
            --arg sif_sha256 "$(sha256sum popgenvcf.sif | cut -d' ' -f1)" \
            --argjson sif_size_bytes "$(stat -c%s popgenvcf.sif)" \
            --arg definition_sha256 "$(sha256sum Apptainer.def | cut -d' ' -f1)" \
            --arg built_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{schema_version: $schema_version, record_type: $record_type, package_version: $package_version, git_commit: $git_commit, apptainer_version: $apptainer_version, sif_sha256: $sif_sha256, sif_size_bytes: $sif_size_bytes, definition_sha256: $definition_sha256, built_at: $built_at}' \
            > apptainer-metadata/apptainer-metadata.json
          sha256sum apptainer-metadata/apptainer-metadata.json > apptainer-metadata/apptainer-metadata-SHA256SUMS.txt

      - name: Write apptainer_distribution gate record
        run: |
          set -euo pipefail
          meta_sha="$(sha256sum apptainer-metadata/apptainer-metadata.json | cut -d' ' -f1)"
          meta_size="$(stat -c%s apptainer-metadata/apptainer-metadata.json)"
          sums_sha="$(sha256sum apptainer-metadata/apptainer-metadata-SHA256SUMS.txt | cut -d' ' -f1)"
          sums_size="$(stat -c%s apptainer-metadata/apptainer-metadata-SHA256SUMS.txt)"
          jq -n \
            --arg gate_id "apptainer_distribution" \
            --arg status "passed" \
            --arg summary "apptainer.yml built and smoke-tested a SIF image from Apptainer.def for the exact evaluated commit (apptainer build, apptainer test, package-version check, --help, and the same scientific/population-structure validation used elsewhere). This workflow has no publish/registry step to gate, so a dispatched run is evidence-equivalent to what a tagged release would produce -- unlike oci_distribution, which requires a real registry push." \
            --arg meta_path "apptainer-metadata.json" --argjson meta_size "$meta_size" --arg meta_sha "$meta_sha" \
            --arg sums_path "apptainer-metadata-SHA256SUMS.txt" --argjson sums_size "$sums_size" --arg sums_sha "$sums_sha" \
            '{gate_id: $gate_id, status: $status, summary: $summary, artifacts: [
                {path: $meta_path, size_bytes: $meta_size, sha256: $meta_sha},
                {path: $sums_path, size_bytes: $sums_size, sha256: $sums_sha}
              ], approval: null}' \
            > apptainer-metadata/apptainer_distribution-gate-record.json

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popgenVCF-apptainer-metadata
          path: apptainer-metadata/
          if-no-files-found: error

      - name: Upload SIF smoke-test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popgenVCF-apptainer-ci
          path: popgenvcf.sif
          if-no-files-found: error
          retention-days: 7
