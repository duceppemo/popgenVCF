name: Release metadata

on:
  pull_request:
    paths:
      - "DESCRIPTION"
      - "LICENSE"
      - ".zenodo.json"
      - "CITATION.cff"
      - "codemeta.json"
      - "inst/CITATION"
      - "inst/metadata/software-identity.json"
      - "R/software_identity.R"
      - "R/software_identity_integration.R"
      - "docs/reproducibility.md"
      - "scripts/validate_release_metadata.R"
      - "scripts/validate_license_metadata.R"
      - "scripts/validate_zenodo_metadata.R"
      - "tests/testthat/test-release-metadata-contract.R"
      - "tests/testthat/test-license-metadata-contract.R"
      - "tests/testthat/test-zenodo-archival-metadata.R"
      - ".github/workflows/release-metadata.yml"
  push:
    branches: [main]
    paths:
      - "DESCRIPTION"
      - "LICENSE"
      - ".zenodo.json"
      - "CITATION.cff"
      - "codemeta.json"
      - "inst/CITATION"
      - "inst/metadata/software-identity.json"
      - "R/software_identity.R"
      - "R/software_identity_integration.R"
      - "docs/reproducibility.md"
      - "scripts/validate_release_metadata.R"
      - "scripts/validate_license_metadata.R"
      - "scripts/validate_zenodo_metadata.R"
      - "tests/testthat/test-release-metadata-contract.R"
      - "tests/testthat/test-license-metadata-contract.R"
      - "tests/testthat/test-zenodo-archival-metadata.R"
      - ".github/workflows/release-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install metadata validators
        run: |
          Rscript -e 'install.packages(c("jsonlite", "yaml", "digest"))'
          python -m pip install --disable-pip-version-check cffconvert

      - name: Validate CFF schema
        run: cffconvert --validate

      - name: Validate JSON syntax
        run: |
          python -m json.tool .zenodo.json >/dev/null
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool inst/metadata/software-identity.json >/dev/null

      - name: Validate metadata consistency
        env:
          POPGENVCF_METADATA_EVIDENCE: artifacts/release-metadata-validation.json
        run: Rscript scripts/validate_release_metadata.R

      - name: Validate LICENSE consistency
        env:
          POPGENVCF_LICENSE_METADATA_EVIDENCE: artifacts/license-metadata-validation.json
        run: Rscript scripts/validate_license_metadata.R

      - name: Validate Zenodo deposition metadata
        env:
          POPGENVCF_ZENODO_METADATA_EVIDENCE: artifacts/zenodo-metadata-validation.json
        run: Rscript scripts/validate_zenodo_metadata.R

      # if: always() is required here, not cosmetic: every validator step
      # above stops the job outright on a genuine metadata inconsistency (a
      # real audit found this step had no `if:` guard at all, so a real
      # validation failure skipped it entirely -- no gate-record JSON was
      # ever written for the exact case this gate exists to catch, even
      # though each validator writes its own evidence JSON with
      # passed: false BEFORE it stop()s). Written defensively for the rarer
      # case where a validator crashed outright before writing its evidence
      # file at all, rather than erroring inside this step too.
      - name: Write metadata_consistency gate record
        if: always()
        run: |
          Rscript -e '
            source("inst/scripts/release_candidate_gate_record.R")
            root <- "artifacts"
            dir.create(root, recursive = TRUE, showWarnings = FALSE)
            paths <- c(
              "artifacts/release-metadata-validation.json",
              "artifacts/license-metadata-validation.json",
              "artifacts/zenodo-metadata-validation.json"
            )
            present <- Filter(file.exists, paths)
            results <- lapply(present, jsonlite::read_json, simplifyVector = FALSE)
            passed <- length(present) == length(paths) &&
              all(vapply(results, function(x) isTRUE(x$passed), logical(1L)))
            missing <- setdiff(paths, present)
            write_release_candidate_gate_record(
              gate_id = "metadata_consistency",
              status = if (passed) "passed" else "failed",
              summary = paste(
                "the three validators run by release-metadata.yml",
                "(validate_release_metadata.R: DESCRIPTION/CITATION.cff/codemeta.json/",
                "software-identity consistency; validate_license_metadata.R: LICENSE/SPDX",
                "consistency; validate_zenodo_metadata.R: .zenodo.json consistency)",
                if (passed) {
                  "all passed with no failing checks."
                } else if (length(missing)) {
                  paste0(
                    "did not all complete -- missing evidence: ",
                    paste(basename(missing), collapse = ", "), "."
                  )
                } else {
                  "reported at least one failing check."
                }
              ),
              artifact_paths = present,
              root = root,
              output_path = "artifacts/metadata_consistency-gate-record.json"
            )
          '

      - name: Upload metadata validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-validation
          path: |
            artifacts/release-metadata-validation.json
            artifacts/license-metadata-validation.json
            artifacts/zenodo-metadata-validation.json
            artifacts/metadata_consistency-gate-record.json
          if-no-files-found: warn
          retention-days: 14
