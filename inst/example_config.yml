schema_version: "1.0"
input:
  vcf: /path/to/cohort_filtered.vcf.gz
  # Optional headered TSV: sample must match VCF; alias is display-only.
  metadata: /path/to/pop_map.tsv
  metadata_header: auto
  # Override the built-in sample/population column-name detection (sample,
  # sample_id, id, individual; population, pop) to treat a differently
  # named metadata column as one of those, without renaming it in the file.
  # Set to null (the default) to use the built-in detection unchanged.
  sample_column: null
  population_column: pathotype
  # Signed decimal degrees, latitude first; use NA for missing pairs.
  geographic_columns: [latitude, longitude]
output:
  directory: /path/to/popgen_results
  figure_formats: [pdf, png]
  dpi: 600
  # accessibility-first, grayscale-safe, or standard-color
  figure_style: accessibility-first
  base_font_size: 11
  label_samples: auto
compute:
  threads: 8
  memory_mb: 32768
  seed: 42
  force_gds: false
qc:
  maf: 0.05
  # Maximum per-variant missing-genotype rate. Feeds both variant_qc()'s own
  # QC gate (which SNPs enter LD pruning) and, via missing.rate below,
  # ld_prune_exact()'s SNPRelate::snpgdsLDpruning() call, plus the ROH
  # module's own missingness gate -- one configured value used consistently
  # everywhere this concept applies. 0.20 is the historical default every
  # prior release used, kept as the default for continuity, not enforced.
  max_variant_missing: 0.20
  max_sample_missing: 0.20
  # LD-pruning parameters (SNPRelate::snpgdsLDpruning(), via ld_prune_exact()
  # in R/qc.R) -- genuinely configurable; these are the historical fixed
  # values every prior release used, kept as the default for continuity.
  # ld_r2 is r^2 (this codebase's own public unit); snpgdsLDpruning()'s
  # ld.threshold is on the r scale, so it is passed sqrt(ld_r2) internally.
  ld_r2: 0.20
  # Maximum physical distance (bp) between two SNPs still compared for LD;
  # .inf disables the distance cap entirely (only slide_max_n bounds the
  # comparison window).
  ld_slide_max_bp: .inf
  # Maximum number of preceding SNPs compared against each candidate.
  ld_slide_max_n: 50
  # Where each chromosome's pruning starts: first, last, random, or
  # random.f500 (snpgdsLDpruning()'s own accepted values).
  ld_start_pos: first
  # Excludes sex/mitochondrial chromosomes from kinship, PCA, DAPC, ancestry
  # backends, ROH, FST, genome scans, diversity, and AMOVA -- these assume
  # uniform diploid genotypes, which a hemizygous sex chromosome violates.
  # sex_check is the deliberate exception and always sees these chromosomes.
  autosome_only: true
  non_autosomal_chromosome_names: [X, "Y", MT, M, chrX, chrY, chrM, chrMT]
analyses:
  diversity: true
  hwe_alpha: 0.05
  # Rarefaction-corrected allelic richness (hierfstat::allelic.richness()).
  # A real, measured cost: on a tiny 60-sample/2000-SNP benchmark this alone
  # took ~3 seconds. Set to false to skip it and keep every other diversity
  # metric (heterozygosity, effective alleles, private alleles, HWE).
  diversity_allelic_richness: true
  bottleneck: true
  # Folded site frequency spectrum and the mode-shift bottleneck screen
  # (Luikart and Cornuet 1998): a mode away from the lowest allele-frequency
  # class is a possible recent-bottleneck signature. Bin count for the
  # frequency classes spanning 0 to 0.5.
  bottleneck_n_bins: 10
  pca: true
  n_pcs: 10
  pca_loading_top_n: 20
  # Extra PCA panel per other metadata column with enough samples per value
  # (min_group) and not too many distinct values (max_levels).
  pca_metadata_color: true
  pca_metadata_color_min_group: 3
  pca_metadata_color_max_levels: 12
  ibs: true
  kinship: true
  # Pairs with kinship above this cutoff are written to 36_close_relatives.tsv.
  # Default is the KING-robust (Manichaikul et al. 2010) 3rd-degree cutoff.
  kinship_close_relative_threshold: 0.0442
  sex_check: true
  # Chromosome name(s) treated as X; comparison against a metadata sex
  # column is skipped transparently when none are found (e.g. single-
  # autosome VCFs). Thresholds are PLINK's own --check-sex convention.
  sex_check_x_chromosome_names: [X, chrX]
  sex_check_male_f_threshold: 0.8
  sex_check_female_f_threshold: 0.2
  # Chromosome-Y call rate, a corroborating second signal alongside X:
  # confident X/Y disagreement is reported as "discordant" rather than
  # silently resolved.
  sex_check_y_chromosome_names: [Y, chrY]
  sex_check_y_male_call_rate_threshold: 0.5
  sex_check_y_female_call_rate_threshold: 0.1
  roh: true
  # Phred-scaled genotype-error rate for bcftools roh's HMM (its own
  # documented "safe value... to account for GT errors").
  roh_gt_error_phred: 30
  # Run-length classification (Ceballos et al. 2018): short runs mostly
  # reflect background LD; intermediate runs reflect distant common
  # ancestors; long runs reflect recent close inbreeding.
  roh_length_class_short_max_bp: 500000
  roh_length_class_long_min_bp: 2000000
  tree: true
  # Nei's (1972) standard genetic distance between populations and an NJ
  # tree from it -- distinct from "tree" above, which is an individual-level
  # tree from IBS distance, not population allele frequencies.
  population_tree: true
  tree_bootstrap:
    enabled: true
    # Locus-resampling bootstrap (Felsenstein 1985) applied to both NJ trees
    # above: 100 replicates is the standard fast-but-informative default
    # (ape::boot.phylo()'s own default) -- large enough that support values
    # are meaningful, small enough to stay fast even sequentially. Runs in
    # parallel across compute.threads workers.
    replicates: 100
  ml_tree:
    # Off by default: a genuine maximum-likelihood tree (GTR+Gamma, Lewis
    # 2001 ascertainment-bias correction, via the optional phangorn package)
    # for the individual-level tree, complementary to the always-on NJ tree
    # from IBS distance above. Opt in when a likelihood-based topology and
    # its own bootstrap support matter more than NJ's speed.
    enabled: false
    bootstrap_replicates: 100
  # Frequency-based self-assignment test (Paetkau et al. 1995, 2004): does
  # each sample's genotype fit its own recorded population's allele
  # frequencies best, or a different one (a candidate migrant or metadata
  # error)? Leave-one-out corrected (Rannala and Mountain 1997).
  population_assignment: true
  fst: true
  genome_scan: true
  # Non-overlapping by default (step = window); set step below window for a
  # real overlapping/sliding scan.
  genome_scan_window_bp: 50000
  genome_scan_step_bp: 50000
  genome_scan_min_snps: 5
  pcadapt: true
  # PCA-based outlier/selection scan (Luu et al. 2016; Prive et al. 2020): a
  # real per-locus test with a calibrated null (Mahalanobis distance of each
  # locus's regression on the retained PCs, chi-squared with K degrees of
  # freedom), distinct from genome_scan's windowed FST above, which has no
  # null distribution. Works from genotypes alone -- unlike almost every
  # other analysis here, no population column is required.
  pcadapt_k: null # defaults to (population count - 1) when unset; needs an explicit value with no population metadata
  pcadapt_min_maf: 0.05
  pcadapt_fdr_alpha: 0.05
  ld_decay: true
  # Computed only on the QC-passed, unpruned SNP set -- the LD-pruned set is
  # selected to have LOW pairwise LD by construction, so decay on it would
  # be a systematic underestimate.
  ld_decay_max_distance_bp: 500000
  ld_decay_bin_bp: 5000
  ld_decay_slide: 100
  ne_ld: true
  # LD-based effective population size (Waples 2006; Waples and Do 2008),
  # per population, from cross-chromosome (unlinked) marker pairs. Subsampled
  # to this many SNPs per population when the marker set is larger, bounding
  # the O(n^2) pairwise LD computation.
  ne_ld_max_snps: 2000
  dapc: true
  dapc_k: 2:10
  # Automatically picks each K's number of retained PCs via
  # adegenet::xvalDapc() cross-validated assignment success (the standard
  # DAPC diagnostic), instead of a fixed default -- retaining too few PCs
  # discards real signal, too many starts to memorize individual samples.
  # See the 12b_DAPC_xval_K<k> (raw cross-validation curve) and
  # 12c_DAPC_eigenvalues_K<k> (DA eigenvalues) figures, and the DAPC
  # section of the Results and Interpretation guide, to judge whether the
  # automatic selection deserves trust before reading K<k>'s clustering.
  dapc_cross_validation: true
  dapc_loading_top_n: 20
  amova: true
  clonality: true
  # Multilocus genotype (MLG) matching and clonal diversity (Kamvar, Tabima,
  # and Grunwald 2014): exact-duplicate detection, poppr's Ia/rbarD, a
  # genotype accumulation curve, and a minimum spanning network. See the
  # Results and Interpretation guide's MLG section, including why this
  # module runs on two deliberately different marker sets.
  clonality_genotype_curve_replicates: 100
  # Set to 0 to skip poppr::poppr()'s Ia/rbarD permutation p-values, which
  # are the slower part of this module on a large cohort; the accumulation
  # curve and duplicate-genotype detection are unaffected.
  clonality_ia_permutations: 0
  sexbias: true
  # Sex-biased dispersal test (Goudet, Perrin, and Waser 2002): does one
  # recorded sex show a systematically lower mean assignment index (AIc)
  # than the other -- the signature of the more-dispersing sex. Requires
  # the optional hierfstat package and a metadata sex column; skips
  # transparently, with a WARNING, when either is absent.
  sexbias_test: mAIc # mAIc (t-test/permutation on mean AIc), or FST/FIS (requires sexbias_permutations > 0)
  sexbias_permutations: 0
  mantel: true
  isolation_by_distance: true
  spatial_autocorrelation: true
  # Distance-class correlogram (Smouse and Peakall 1999): a genetic
  # autocorrelation coefficient r per geographic-distance class, with a
  # permutation-based null envelope and p-value -- a distance-resolved
  # complement to the single overall Mantel r above.
  spatial_autocorrelation_bins: 10
  spatial_autocorrelation_permutations: 999
  chromosome_specific: true
  chromosome_min_snps: 100
  bootstrap:
    enabled: false
    replicates: 500
    unit: chromosome
  # Despite the name, this governs DAPC's own reproducibility replicates
  # above (dapc_cross_validation's companion diagnostic), not the ADMIXTURE/
  # fastStructure/sNMF backends below: each K is re-fit this many times with
  # a different seed and cluster assignments compared for stability.
  structure:
    replicates: 3
    seeds: null
    reproducibility_rmse: 0.05
    minimum_cluster_correlation: 0.90
  admixture:
    enabled: false
    executable: admixture
    # Optional: otherwise generated from retained samples and LD-pruned SNPs.
    plink_prefix: null
    k: 2:10
    threads: auto
    cv_folds: 5
    # Accepted for schema symmetry with snmf.q_sample_file below, but
    # currently unused: PLINK's own .fam file already carries authoritative
    # sample order for the Q-matrix, so no separate override is needed.
    q_sample_file: null
    # Maximum wall-clock seconds allowed per K value before ADMIXTURE (and
    # its full process tree) is killed and treated as a failure -- guards
    # against a hang on a degenerate or malformed genotype matrix rather
    # than blocking the pipeline forever with no way to recover.
    timeout_seconds: 14400
  faststructure:
    enabled: false
    structure_executable: structure.py
    choosek_executable: chooseK.py
    # Optional: otherwise generated from retained samples and LD-pruned SNPs.
    plink_prefix: null
    k: 2:10
    # Same schema-symmetry note as admixture.q_sample_file above: accepted
    # but currently unused.
    q_sample_file: null
    # Maximum wall-clock seconds allowed per subprocess call (each K value's
    # structure.py run, and the final chooseK.py run) before it is killed
    # and treated as a failure.
    timeout_seconds: 14400
  snmf:
    enabled: false
    # Optional pair: otherwise generated from retained samples and LD-pruned SNPs.
    geno_file: null
    q_sample_file: null
    k: 2:10
    repetitions: 5
    entropy: true
    threads: auto
report:
  enabled: true
  title: Population genomics analysis
  author: Marc-Olivier Duceppe
# Population-structure reproducibility settings are nested under analyses.structure.
# External fastStructure and sNMF modules are disabled unless explicitly enabled.
