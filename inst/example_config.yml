schema_version: "1.0"
input:
  vcf: /path/to/cohort_filtered.vcf.gz
  # Optional headered TSV: sample must match VCF; alias is display-only.
  metadata: /path/to/pop_map.tsv
  metadata_header: auto
  # Signed decimal degrees, latitude first; use NA for missing pairs.
  geographic_columns: [latitude, longitude]
output:
  directory: /path/to/popgen_results
  figure_formats: [pdf, png]
  dpi: 600
  label_samples: auto
compute:
  threads: 8
  memory_mb: 32768
  seed: 42
  force_gds: false
qc:
  maf: 0.05
  max_variant_missing: 0.20
  max_sample_missing: 0.20
  ld_r2: 0.20
  ld_slide_max_bp: .inf
  ld_slide_max_n: 50
  ld_start_pos: first
analyses:
  diversity: false
  pca: true
  n_pcs: 10
  ibs: true
  tree: true
  fst: false
  dapc: false
  dapc_k: 2:10
  dapc_cross_validation: true
  amova: false
  mantel: false
  isolation_by_distance: false
  chromosome_specific: false
  chromosome_min_snps: 100
  bootstrap:
    enabled: false
    replicates: 500
    unit: chromosome
  structure:
    replicates: 3
    seeds: null
    reproducibility_rmse: 0.05
    minimum_cluster_correlation: 0.90
  admixture:
    enabled: false
    executable: admixture
    # Optional: otherwise generated from retained samples and LD-pruned SNPs.
    plink_prefix: null
    k: 2:10
    threads: auto
    cv_folds: 5
  faststructure:
    enabled: false
    structure_executable: structure.py
    choosek_executable: chooseK.py
    # Optional: otherwise generated from retained samples and LD-pruned SNPs.
    plink_prefix: null
    k: 2:10
  snmf:
    enabled: false
    # Optional pair: otherwise generated from retained samples and LD-pruned SNPs.
    geno_file: null
    q_sample_file: null
    k: 2:10
    repetitions: 5
    entropy: true
    threads: auto
report:
  enabled: true
  title: Population genomics analysis
  author: Marc-Olivier Duceppe
# Population-structure reproducibility settings are nested under analyses.structure.
# External fastStructure and sNMF modules are disabled unless explicitly enabled.
