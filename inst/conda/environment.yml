name: popgenvcf
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Keep the Conda solve focused on a modern R runtime, CRAN packages, and
  # stable command-line tools. Bioconductor packages are installed afterward
  # with BiocManager so their release is matched to this R version.
  - r-base>=4.5,<4.6
  - r-biocmanager

  # Required CRAN dependencies declared by popgenVCF.
  - r-ade4
  - r-adegenet
  - r-ape
  - r-data.table
  - r-digest
  - r-ggplot2
  - r-ggrepel
  - r-igraph
  - r-jsonlite
  - r-openssl
  - r-poppr
  - r-processx
  - r-rmarkdown
  - r-scales
  - r-vegan
  - r-yaml

  # Optional R analyses, testing, documentation, and development tools.
  - r-clue
  - r-covr
  - r-hierfstat
  - r-knitr
  - r-patchwork
  - r-pcadapt
  - r-phangorn
  - r-pkgdown
  - r-ragg
  - r-remotes
  - r-svglite
  - r-testthat>=3

  # Stable external population-genetics and VCF utilities.
  - plink
  - plink2
  - admixture
  - faststructure
  - bcftools
  - htslib
  - vcftools

  # Report and package-check utilities. The container definitions install a
  # complete TeX engine through the operating system; native Conda users must
  # provide XeLaTeX, LuaLaTeX, or pdfLaTeX separately for PDF output.
  - pandoc
  - qpdf
  - tidy-html5

  # Build/runtime utilities for R packages installed from source.
  #
  # gcc/g++/gfortran pinned to the 13.x series (rather than the unpinned
  # `compilers` meta-package, which now resolves to GCC 15.3.0): a
  # 2026-08-18 apptainer.yml build failed compiling gdsfmt's vendored,
  # years-old xz-5.2.9 source with a silent, uninformative linker error
  # (see NEWS.md/ROADMAP.md) -- disk exhaustion, C-standard flags, make -j
  # and install.packages() parallelism, and an OOM kill were all ruled out
  # with direct evidence from a live debug session on the actual failing
  # runner. GCC 15 (released 2025) is far newer than this bundled xz
  # release; pinning to a longer-established compiler series is the
  # standard mitigation for an old vendored build breaking under a very
  # new toolchain, tried here as the next concrete hypothesis.
  - make
  - gcc_linux-64=13
  - gxx_linux-64=13
  - gfortran_linux-64=13
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - pkg-config
  - git
  - curl
  - unzip
  - zip
